<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0f1115;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#e8eaf0}
.w{width:480px;padding:28px 24px}
h1{font-size:26px;margin:0 0 18px}
table{width:100%;border-collapse:collapse;background:#1a1e26;border-radius:12px;overflow:hidden;font-size:20px;margin-bottom:16px}
th{background:#252b36;text-align:left;padding:12px 16px;font-size:14px;color:#9aa3b2;text-transform:uppercase;letter-spacing:.04em}
td{padding:14px 16px;border-top:1px solid #262c37}
.n{text-align:right;font-variant-numeric:tabular-nums}
.g{color:#5ad19a;font-weight:700}
</style></head><body><div class="w">
<h1>Calorie Plan</h1>
<table><tr><th>Day</th><th class="n">Eat</th></tr>
<tr><td>Mon–Fri</td><td class="n g">3,450</td></tr>
<tr><td>Saturday</td><td class="n g">3,000</td></tr>
<tr><td>Sunday</td><td class="n g">2,600</td></tr></table>
<table><tr><th>Every day</th><th class="n">Grams</th></tr>
<tr><td>Protein</td><td class="n">170</td></tr>
<tr><td>Fat</td><td class="n">75</td></tr>
<tr><td>Carbs</td><td class="n">Rest</td></tr></table>
</div></body></html>
